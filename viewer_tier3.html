<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tier3 Comparison Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }

  .top-bar {
    position: sticky; top: 0; z-index: 100;
    background: #fff; border-bottom: 1px solid #ddd;
    padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .top-bar label { font-weight: 600; font-size: 13px; color: #555; }
  .top-bar select, .top-bar input[type=text] {
    padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
    background: #fff;
  }
  .top-bar input[type=text] { width: 220px; }
  .top-bar .count { font-size: 13px; color: #888; margin-left: auto; }

  .nav-bar {
    position: sticky; top: 56px; z-index: 99;
    background: #fafafa; border-bottom: 1px solid #e0e0e0;
    padding: 8px 24px; display: flex; gap: 10px; align-items: center;
  }
  .nav-bar button {
    padding: 6px 16px; border: 1px solid #ccc; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 13px;
  }
  .nav-bar button:hover { background: #eee; }
  .nav-bar button:disabled { opacity: .4; cursor: default; }
  .nav-bar .page-info { font-size: 13px; color: #666; }
  .nav-bar .jump { display: flex; gap: 4px; align-items: center; margin-left: auto; }
  .nav-bar .jump input { width: 70px; padding: 5px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  .nav-bar .jump button { padding: 5px 12px; }

  .cards { padding: 20px 24px; display: flex; flex-direction: column; gap: 24px; }

  .card {
    background: #fff; border-radius: 10px; border: 1px solid #e0e0e0;
    overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .card-header {
    padding: 14px 20px; background: #f8f9fa; border-bottom: 1px solid #e8e8e8;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .card-header .id { font-weight: 700; font-size: 15px; color: #1a73e8; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }
  .badge.dataset { background: #e8f0fe; color: #1a73e8; }
  .badge.domain { background: #fce8e6; color: #d93025; }
  .badge.qtype { background: #e6f4ea; color: #137333; }
  .badge.subdomain { background: #fef7e0; color: #b06000; }
  .badge.engine { background: #f3e8fd; color: #6a1b9a; }
  .badge.status-completed { background: #e6f4ea; color: #137333; }
  .badge.status-failed { background: #fce8e6; color: #d93025; }

  .edit-summary {
    padding: 12px 20px; background: #fff8e1; border-bottom: 1px solid #f0e0a0;
    font-size: 13px; line-height: 1.6; color: #5a4a00;
  }
  .edit-summary strong { color: #4a3a00; }
  .changes-list { margin-top: 6px; padding-left: 20px; }
  .changes-list li { font-size: 12px; line-height: 1.55; color: #6a5a00; }

  .compare-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  }
  .compare-col {
    padding: 18px 20px; border-right: 1px solid #e8e8e8;
  }
  .compare-col:last-child { border-right: none; }
  .compare-col.original { background: #fafbfc; }
  .compare-col.revised { background: #f5fbf7; }

  .col-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; margin-bottom: 10px;
    padding-bottom: 6px; border-bottom: 2px solid;
  }
  .compare-col.original .col-title { color: #5f6368; border-color: #c0c4c8; }
  .compare-col.revised .col-title { color: #137333; border-color: #a8d5b5; }

  .question-text {
    font-size: 13px; line-height: 1.65; margin-bottom: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .question-text .img-placeholder {
    display: inline-block; vertical-align: middle;
    background: #e8f0fe; color: #1a73e8; padding: 1px 6px;
    border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .question-text .img-placeholder:hover { background: #c6dafa; }

  .figure-box {
    border: 1px solid #e0e0e0; border-radius: 8px; background: #fff;
    padding: 12px; text-align: center; margin-bottom: 12px;
    max-height: 360px; overflow: auto;
  }
  .figure-box img, .figure-box svg {
    max-width: 100%; max-height: 320px; display: inline-block;
    cursor: zoom-in;
  }
  .figure-caption {
    font-size: 11px; color: #888; margin-top: 6px;
  }

  .answer-box {
    padding: 10px 14px; background: #fff; border: 1px solid #e0e0e0;
    border-radius: 6px; font-size: 13px; line-height: 1.55;
  }
  .answer-box .label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    color: #888; letter-spacing: .5px; margin-bottom: 4px;
  }
  .compare-col.original .answer-box .label { color: #5f6368; }
  .compare-col.revised .answer-box .label { color: #137333; }
  .answer-text { font-weight: 600; color: #333; word-break: break-word; }
  .compare-col.revised .answer-text { color: #137333; }

  .options-list {
    margin-bottom: 12px; font-size: 12px; line-height: 1.55;
  }
  .options-list .option-item { padding: 3px 0; }

  details.solution {
    margin-top: 10px; padding: 10px 14px;
    background: #f0f4ff; border: 1px solid #d0ddf5; border-radius: 6px;
    font-size: 12px; line-height: 1.6;
  }
  details.solution summary {
    cursor: pointer; font-weight: 600; color: #1a4fad;
    user-select: none;
  }
  details.solution .solution-body {
    margin-top: 8px; white-space: pre-wrap; word-break: break-word;
    color: #333;
  }

  .loading { text-align: center; padding: 60px; font-size: 18px; color: #888; }
  .empty { text-align: center; padding: 60px; font-size: 16px; color: #999; }

  /* Lightbox */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.9); align-items: center; justify-content: center; cursor: zoom-out;
    padding: 20px;
  }
  .lightbox.active { display: flex; }
  .lightbox .lightbox-content {
    max-width: 95vw; max-height: 95vh; background: #fff;
    border-radius: 8px; padding: 20px; overflow: auto;
  }
  .lightbox img, .lightbox svg {
    max-width: 90vw; max-height: 85vh; object-fit: contain; display: block;
  }

  @media (max-width: 900px) {
    .compare-grid { grid-template-columns: 1fr; }
    .compare-col { border-right: none; border-bottom: 1px solid #e8e8e8; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <label>Dataset:</label>
  <select id="filterDataset"><option value="">All</option></select>
  <label>Domain:</label>
  <select id="filterDomain"><option value="">All</option></select>
  <label>Engine:</label>
  <select id="filterEngine"><option value="">All</option></select>
  <label>Search:</label>
  <input type="text" id="searchBox" placeholder="ID or keyword…">
  <span class="count" id="countLabel"></span>
</div>

<div class="nav-bar">
  <button id="btnFirst">⟨⟨ First</button>
  <button id="btnPrev">⟨ Prev</button>
  <span class="page-info" id="pageInfo"></span>
  <button id="btnNext">Next ⟩</button>
  <button id="btnLast">Last ⟩⟩</button>
  <div class="jump">
    <input type="text" id="jumpInput" placeholder="Page #">
    <button id="btnJump">Go</button>
  </div>
</div>

<div class="cards" id="cardContainer">
  <div class="loading" id="loadingMsg">Loading tier3_sample.json…</div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-content" id="lightboxContent"></div>
</div>

<script>
const PAGE_SIZE = 5;
let allData = [];
let filtered = [];
let page = 0;

// --- Load data ---
fetch('tier3_sample.json')
  .then(r => r.json())
  .then(data => {
    allData = (data.tasks || []).filter(t => t.status === 'completed');
    populateFilters();
    applyFilters();
    const lm = document.getElementById('loadingMsg');
    if (lm) lm.remove();
  })
  .catch(e => {
    document.getElementById('loadingMsg').textContent = 'Failed to load tier3_sample.json: ' + e.message;
  });

function getOrig(t, key) {
  return (t.original_problem && t.original_problem[key]) || null;
}

function populateFilters() {
  const datasets = [...new Set(allData.map(t => getOrig(t, 'dataset')).filter(Boolean))].sort();
  const domains = [...new Set(allData.map(t => getOrig(t, 'domain')).filter(Boolean))].sort();
  const engines = [...new Set(allData.map(t => t.engine).filter(Boolean))].sort();

  const selDS = document.getElementById('filterDataset');
  datasets.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; selDS.appendChild(o); });

  const selDom = document.getElementById('filterDomain');
  domains.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; selDom.appendChild(o); });

  const selEng = document.getElementById('filterEngine');
  engines.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; selEng.appendChild(o); });
}

function applyFilters() {
  const ds = document.getElementById('filterDataset').value;
  const dom = document.getElementById('filterDomain').value;
  const eng = document.getElementById('filterEngine').value;
  const search = document.getElementById('searchBox').value.toLowerCase().trim();

  filtered = allData.filter(t => {
    if (ds && getOrig(t, 'dataset') !== ds) return false;
    if (dom && getOrig(t, 'domain') !== dom) return false;
    if (eng && t.engine !== eng) return false;
    if (search) {
      const hay = [
        t.problem_id || '',
        getOrig(t, 'question') || '',
        t.edited_question || '',
        t.edit_summary || ''
      ].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  page = 0;
  render();
}

document.getElementById('filterDataset').addEventListener('change', applyFilters);
document.getElementById('filterDomain').addEventListener('change', applyFilters);
document.getElementById('filterEngine').addEventListener('change', applyFilters);
let searchTimer;
document.getElementById('searchBox').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilters, 300);
});

// --- Navigation ---
function totalPages() { return Math.max(1, Math.ceil(filtered.length / PAGE_SIZE)); }

document.getElementById('btnFirst').addEventListener('click', () => { page = 0; render(); });
document.getElementById('btnPrev').addEventListener('click', () => { if (page > 0) { page--; render(); } });
document.getElementById('btnNext').addEventListener('click', () => { if (page < totalPages() - 1) { page++; render(); } });
document.getElementById('btnLast').addEventListener('click', () => { page = totalPages() - 1; render(); });
document.getElementById('btnJump').addEventListener('click', () => {
  const v = parseInt(document.getElementById('jumpInput').value);
  if (v >= 1 && v <= totalPages()) { page = v - 1; render(); document.getElementById('jumpInput').value = ''; }
});
document.getElementById('jumpInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnJump').click(); });

// --- Render helpers ---
function escapeHTML(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/`/g, '&#96;').replace(/\$/g, '&#36;');
}

function renderImagePlaceholders(text, images) {
  const escaped = escapeHTML(text);
  return escaped.replace(/&lt;image_(\d+)&gt;/g, (match, num) => {
    const idx = parseInt(num) - 1;
    if (images && images[idx]) {
      return `<span class="img-placeholder" onclick="openLightboxImg('${images[idx]}')">[Image ${num}]</span>`;
    }
    return `<span class="img-placeholder">[Image ${num} - missing]</span>`;
  });
}

function answerText(ans) {
  if (ans == null) return '—';
  if (Array.isArray(ans)) return ans.join(', ');
  return String(ans);
}

function optionsHTML(opts) {
  if (!opts) return '';
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let items = [];
  if (Array.isArray(opts)) {
    items = opts.map((v, i) => [letters[i], v]);
  } else if (typeof opts === 'object') {
    items = Object.keys(opts).sort().map(k => [k, opts[k]]);
  } else {
    return '';
  }
  if (!items.length) return '';
  return '<div class="options-list">' + items.map(([k, v]) =>
    `<div class="option-item"><strong>${escapeHTML(k)}.</strong> ${escapeHTML(String(v))}</div>`
  ).join('') + '</div>';
}

// Strip the XML declaration from SVG content so it can be injected inline.
function cleanSVG(svg) {
  if (!svg) return '';
  return svg.replace(/<\?xml[^?]*\?>/g, '').trim();
}

// --- Render ---
function render() {
  const container = document.getElementById('cardContainer');
  const start = page * PAGE_SIZE;
  const slice = filtered.slice(start, start + PAGE_SIZE);

  document.getElementById('countLabel').textContent = `${filtered.length.toLocaleString()} tasks`;
  document.getElementById('pageInfo').textContent = `Page ${page + 1} of ${totalPages()}`;
  document.getElementById('btnFirst').disabled = page === 0;
  document.getElementById('btnPrev').disabled = page === 0;
  document.getElementById('btnNext').disabled = page >= totalPages() - 1;
  document.getElementById('btnLast').disabled = page >= totalPages() - 1;

  if (slice.length === 0) {
    container.innerHTML = '<div class="empty">No matching tasks.</div>';
    return;
  }

  container.innerHTML = slice.map((t, i) => {
    const globalIdx = start + i;
    const orig = t.original_problem || {};
    const origImages = orig.images || [];

    // Original side
    const origQHTML = renderImagePlaceholders(orig.question || '', origImages);
    let origFigsHTML = '';
    if (origImages.length) {
      origFigsHTML = origImages.map((src, j) => `
        <div class="figure-box">
          <img src="${src}" alt="Original image ${j+1}" loading="lazy" onclick="openLightboxImg('${src}')">
          <div class="figure-caption">Image ${j+1}: ${escapeHTML(src.split('/').pop())}</div>
        </div>
      `).join('');
    }
    const origOptsHTML = optionsHTML(orig.options);
    const origAns = answerText(orig.answer);

    // Revised side
    const revImages = []; // edited question generally uses the new SVG, not original images
    const revQHTML = renderImagePlaceholders(t.edited_question || '', revImages);
    const svgInline = cleanSVG(t.svg_content);
    const svgId = `svg-${globalIdx}`;
    const revFigHTML = svgInline
      ? `<div class="figure-box" onclick="openLightboxSVG('${svgId}')">
           <div id="${svgId}">${svgInline}</div>
           <div class="figure-caption">New diagram (${escapeHTML(t.engine || 'svg')}) — click to enlarge</div>
         </div>`
      : '<div class="figure-caption">[no diagram]</div>';
    const revOptsHTML = optionsHTML(t.edited_options);
    const revAns = answerText(t.edited_answer);

    // Edit summary + changes
    const changes = Array.isArray(t.changes) ? t.changes : [];
    const changesHTML = changes.length
      ? '<ul class="changes-list">' + changes.map(c => `<li>${escapeHTML(c)}</li>`).join('') + '</ul>'
      : '';
    const summaryHTML = (t.edit_summary || changes.length)
      ? `<div class="edit-summary">
           ${t.edit_summary ? `<strong>Edit summary:</strong> ${escapeHTML(t.edit_summary)}` : ''}
           ${changesHTML}
         </div>`
      : '';

    // Solution (collapsible)
    const solHTML = t.solution
      ? `<details class="solution">
           <summary>Show revised solution</summary>
           <div class="solution-body">${escapeHTML(t.solution)}</div>
         </details>`
      : '';

    const dataset = orig.dataset || '';
    const domain = orig.domain || '';
    const subdomain = orig.subdomain || '';
    const qtype = orig.question_type || '';

    return `<div class="card">
      <div class="card-header">
        <span class="id">${escapeHTML(t.problem_id)}</span>
        ${dataset ? `<span class="badge dataset">${escapeHTML(dataset)}</span>` : ''}
        ${domain ? `<span class="badge domain">${escapeHTML(domain)}</span>` : ''}
        ${qtype ? `<span class="badge qtype">${escapeHTML(qtype)}</span>` : ''}
        ${subdomain ? `<span class="badge subdomain">${escapeHTML(subdomain)}</span>` : ''}
        <span class="badge engine">engine: ${escapeHTML(t.engine || '?')}</span>
        <span class="badge status-${escapeHTML(t.status)}">${escapeHTML(t.status)}</span>
      </div>
      ${summaryHTML}
      <div class="compare-grid">
        <div class="compare-col original">
          <div class="col-title">Original Problem</div>
          <div class="question-text">${origQHTML}</div>
          ${origFigsHTML}
          ${origOptsHTML}
          <div class="answer-box">
            <div class="label">Original answer</div>
            <div class="answer-text">${escapeHTML(origAns)}</div>
          </div>
        </div>
        <div class="compare-col revised">
          <div class="col-title">Revised (Tier 3) Problem</div>
          <div class="question-text">${revQHTML}</div>
          ${revFigHTML}
          ${revOptsHTML}
          <div class="answer-box">
            <div class="label">Revised answer</div>
            <div class="answer-text">${escapeHTML(revAns)}</div>
          </div>
          ${solHTML}
        </div>
      </div>
    </div>`;
  }).join('');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// --- Lightbox ---
function openLightboxImg(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxContent').innerHTML = `<img src="${src}">`;
  lb.classList.add('active');
}
function openLightboxSVG(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxContent').innerHTML = el.innerHTML;
  lb.classList.add('active');
}
document.getElementById('lightbox').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('active');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('active');
});
</script>
</body>
</html>
