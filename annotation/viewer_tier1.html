<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tier1 Questions Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }

  .top-bar {
    position: sticky; top: 0; z-index: 100;
    background: #fff; border-bottom: 1px solid #ddd;
    padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .top-bar label { font-weight: 600; font-size: 13px; color: #555; }
  .top-bar select, .top-bar input[type=text] {
    padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
    background: #fff;
  }
  .top-bar input[type=text] { width: 200px; }
  .top-bar .count { font-size: 13px; color: #888; margin-left: auto; }

  .nav-bar {
    position: sticky; top: 56px; z-index: 99;
    background: #fafafa; border-bottom: 1px solid #e0e0e0;
    padding: 8px 24px; display: flex; gap: 10px; align-items: center;
  }
  .nav-bar button {
    padding: 6px 16px; border: 1px solid #ccc; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 13px;
  }
  .nav-bar button:hover { background: #eee; }
  .nav-bar button:disabled { opacity: .4; cursor: default; }
  .nav-bar .page-info { font-size: 13px; color: #666; }
  .nav-bar .jump { display: flex; gap: 4px; align-items: center; margin-left: auto; }
  .nav-bar .jump input { width: 70px; padding: 5px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  .nav-bar .jump button { padding: 5px 12px; }

  .cards { padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }

  .card {
    background: #fff; border-radius: 10px; border: 1px solid #e0e0e0;
    overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .card-header {
    padding: 14px 20px; background: #f8f9fa; border-bottom: 1px solid #e8e8e8;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .card-header .id { font-weight: 700; font-size: 15px; color: #1a73e8; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }
  .badge.dataset { background: #e8f0fe; color: #1a73e8; }
  .badge.domain { background: #fce8e6; color: #d93025; }
  .badge.qtype { background: #e6f4ea; color: #137333; }
  .badge.subdomain { background: #fef7e0; color: #b06000; }

  .card-body { padding: 20px; }

  .section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    color: #888; letter-spacing: .5px; margin-bottom: 8px;
  }

  .question-text {
    font-size: 14px; line-height: 1.7; margin-bottom: 16px;
    white-space: pre-wrap; word-break: break-word;
  }
  .question-text .img-placeholder {
    display: inline-block; vertical-align: middle;
    background: #e8f0fe; color: #1a73e8; padding: 1px 6px;
    border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .question-text .img-placeholder:hover { background: #c6dafa; }

  .images-row {
    display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
  }
  .img-container {
    border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden;
    background: #fafafa; text-align: center; max-width: 320px;
  }
  .img-container img {
    display: block; max-width: 100%; max-height: 280px;
    object-fit: contain; margin: 0 auto;
  }
  .img-container .img-label {
    padding: 4px 8px; font-size: 11px; color: #666;
    background: #f0f0f0; border-top: 1px solid #e0e0e0;
  }

  .orig-answer-row {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 14px; background: #f0faf0; border-radius: 6px;
    font-size: 14px; margin-bottom: 20px;
  }
  .orig-answer-row strong { color: #137333; }

  .tier1-section {
    border-top: 2px dashed #e0e0e0; padding-top: 16px; margin-top: 8px;
  }
  .tier1-title {
    font-size: 14px; font-weight: 700; color: #444; margin-bottom: 12px;
  }
  .tier1-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 14px;
  }
  .tier1-card {
    border: 1px solid #e0e0e0; border-radius: 8px; padding: 14px;
    background: #fafbfc;
  }
  .tier1-card .t1-header {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .t1-type-badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 700;
  }
  .t1-type-A { background: #e0f2f1; color: #00695c; }
  .t1-type-B { background: #ede7f6; color: #4527a0; }
  .t1-type-C { background: #fff3e0; color: #e65100; }
  .t1-qid { font-size: 11px; color: #999; font-family: monospace; }
  .tier1-card .t1-question {
    font-size: 13px; line-height: 1.55; margin-bottom: 10px;
    white-space: pre-wrap; word-break: break-word;
  }
  .t1-options { margin-bottom: 8px; }
  .t1-option {
    display: flex; gap: 8px; padding: 5px 10px; margin-bottom: 3px;
    border-radius: 5px; font-size: 13px; line-height: 1.5;
  }
  .t1-option.correct { background: #e6f4ea; }
  .t1-option-letter { font-weight: 700; min-width: 18px; color: #555; }
  .t1-option.correct .t1-option-letter { color: #137333; }
  .t1-answer {
    font-size: 12px; color: #137333; padding: 6px 10px;
    background: #f0faf0; border-radius: 5px;
  }
  .t1-answer .toggle { color: #1a73e8; cursor: pointer; user-select: none; font-weight: 600; }

  .t1-votes { font-size: 12px; margin-top: 6px; padding: 6px 10px; border-radius: 5px; background: #f5f5f7; }
  .t1-votes .vote-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .t1-votes .vote-pill {
    display: inline-block; padding: 1px 7px; border-radius: 10px;
    font-size: 11px; font-family: monospace;
  }
  .t1-votes .vote-pill.match { background: #e6f4ea; color: #137333; }
  .t1-votes .vote-pill.mismatch { background: #fce8e6; color: #d93025; }
  .t1-agreement-badge {
    display: inline-block; padding: 1px 7px; border-radius: 10px;
    font-size: 11px; font-weight: 600; margin-left: 6px;
  }
  .agree-all_agree { background: #e6f4ea; color: #137333; }
  .agree-two_agree { background: #fef7e0; color: #b06000; }
  .agree-all_disagree { background: #fce8e6; color: #d93025; }
  .agree-incomplete { background: #eceff1; color: #546e7a; }

  .loading { text-align: center; padding: 60px; font-size: 18px; color: #888; }
  .empty { text-align: center; padding: 60px; font-size: 16px; color: #999; }

  /* Lightbox */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.85); align-items: center; justify-content: center; cursor: zoom-out;
  }
  .lightbox.active { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 92vh; object-fit: contain; border-radius: 8px; }
</style>
</head>
<body>

<div class="top-bar">
  <label>Dataset:</label>
  <select id="filterDataset"><option value="">All</option></select>
  <label>Domain:</label>
  <select id="filterDomain"><option value="">All</option></select>
  <label>Type:</label>
  <select id="filterType"><option value="">All</option></select>
  <label>Agreement:</label>
  <select id="filterAgreement">
    <option value="">All</option>
    <option value="all_agree">All 3 agree</option>
    <option value="two_agree">2 agree, 1 disagree</option>
    <option value="all_disagree">All 3 differ</option>
    <option value="incomplete">Incomplete votes (&lt;3)</option>
  </select>
  <label>Search:</label>
  <input type="text" id="searchBox" placeholder="ID or keyword…">
  <span class="count" id="countLabel"></span>
</div>

<div class="nav-bar">
  <button id="btnFirst">⟨⟨ First</button>
  <button id="btnPrev">⟨ Prev</button>
  <span class="page-info" id="pageInfo"></span>
  <button id="btnNext">Next ⟩</button>
  <button id="btnLast">Last ⟩⟩</button>
  <label style="margin-left:16px;"><input type="checkbox" id="revealAll"> Reveal all answers</label>
  <div class="jump">
    <input type="text" id="jumpInput" placeholder="Page #">
    <button id="btnJump">Go</button>
  </div>
</div>

<div class="cards" id="cardContainer">
  <div class="loading" id="loadingMsg">Loading data…</div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="">
</div>

<script>
const PAGE_SIZE = 10;
let allData = [];
let filtered = [];
let page = 0;
let revealAll = false;
let revealedT1 = new Set();  // keys like "globalIdx:t1Idx"

// --- Load data ---
fetch('filtered_data_with_solution_hard_tier1_fixed.json')
  .then(r => r.json())
  .then(data => {
    // Only keep items that have tier1_questions
    allData = data.filter(d => Array.isArray(d.tier1_questions) && d.tier1_questions.length > 0);
    populateFilters();
    applyFilters();
    document.getElementById('loadingMsg').remove();
  })
  .catch(e => {
    document.getElementById('loadingMsg').textContent = 'Failed to load tier1_filtered_hard.json: ' + e.message;
  });

function shortModel(name) {
  if (!name) return '';
  return name
    .replace(/^us\./, '')
    .replace(/^anthropic\./, '')
    .replace(/-v1$/, '')
    .replace(/-preview$/, '')
    .replace('claude-', '')
    .replace('gemini-', 'gem-')
    .replace('gpt-', '');
}

function classifyAgreement(q) {
  const mv = (q.reference_answers && q.reference_answers.model_votes) || {};
  const votes = Object.values(mv);
  if (votes.length < 3) return 'incomplete';
  const counts = {};
  votes.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  const top = Math.max(...Object.values(counts));
  if (top === 3) return 'all_agree';
  if (top === 2) return 'two_agree';
  return 'all_disagree';
}

const AGREEMENT_LABELS = {
  all_agree: 'All agree',
  two_agree: '2 vs 1',
  all_disagree: 'All differ',
  incomplete: 'Incomplete',
};

function populateFilters() {
  const datasets = [...new Set(allData.map(d => d.dataset))].sort();
  const domains = [...new Set(allData.map(d => d.domain).filter(Boolean))].sort();
  const types = [...new Set(allData.map(d => d.question_type).filter(Boolean))].sort();

  const selDS = document.getElementById('filterDataset');
  datasets.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = `${v} (${allData.filter(d=>d.dataset===v).length})`; selDS.appendChild(o); });

  const selDom = document.getElementById('filterDomain');
  domains.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; selDom.appendChild(o); });

  const selType = document.getElementById('filterType');
  types.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; selType.appendChild(o); });
}

function applyFilters() {
  const ds = document.getElementById('filterDataset').value;
  const dom = document.getElementById('filterDomain').value;
  const qt = document.getElementById('filterType').value;
  const agree = document.getElementById('filterAgreement').value;
  const search = document.getElementById('searchBox').value.toLowerCase().trim();

  filtered = allData.filter(d => {
    if (ds && d.dataset !== ds) return false;
    if (dom && d.domain !== dom) return false;
    if (qt && d.question_type !== qt) return false;
    if (search && !d.id.toLowerCase().includes(search) && !(d.question || '').toLowerCase().includes(search)) return false;
    if (agree) {
      const t1 = d.tier1_questions || [];
      if (!t1.some(q => classifyAgreement(q) === agree)) return false;
    }
    return true;
  });

  page = 0;
  revealedT1.clear();
  render();
}

document.getElementById('filterDataset').addEventListener('change', applyFilters);
document.getElementById('filterDomain').addEventListener('change', applyFilters);
document.getElementById('filterType').addEventListener('change', applyFilters);
document.getElementById('filterAgreement').addEventListener('change', applyFilters);
document.getElementById('revealAll').addEventListener('change', e => {
  revealAll = e.target.checked;
  render();
});
let searchTimer;
document.getElementById('searchBox').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilters, 300);
});

// --- Navigation ---
function totalPages() { return Math.max(1, Math.ceil(filtered.length / PAGE_SIZE)); }

document.getElementById('btnFirst').addEventListener('click', () => { page = 0; render(); });
document.getElementById('btnPrev').addEventListener('click', () => { if (page > 0) { page--; render(); } });
document.getElementById('btnNext').addEventListener('click', () => { if (page < totalPages() - 1) { page++; render(); } });
document.getElementById('btnLast').addEventListener('click', () => { page = totalPages() - 1; render(); });
document.getElementById('btnJump').addEventListener('click', () => {
  const v = parseInt(document.getElementById('jumpInput').value);
  if (v >= 1 && v <= totalPages()) { page = v - 1; render(); document.getElementById('jumpInput').value = ''; }
});
document.getElementById('jumpInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnJump').click(); });

// --- Render ---
function escapeHTML(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/`/g, '&#96;').replace(/\$/g, '&#36;');
}

function renderImagePlaceholders(text, images) {
  const escaped = escapeHTML(text);
  return escaped.replace(/&lt;image_(\d+)&gt;/g, (match, num) => {
    const idx = parseInt(num) - 1;
    if (images && images[idx]) {
      return `<span class="img-placeholder" onclick="openLightbox('${images[idx]}')">[Image ${num}]</span>`;
    }
    return `<span class="img-placeholder">[Image ${num} - missing]</span>`;
  });
}

function render() {
  const container = document.getElementById('cardContainer');
  const start = page * PAGE_SIZE;
  const slice = filtered.slice(start, start + PAGE_SIZE);

  document.getElementById('countLabel').textContent = `${filtered.length.toLocaleString()} samples`;
  document.getElementById('pageInfo').textContent = `Page ${page + 1} of ${totalPages()}`;
  document.getElementById('btnFirst').disabled = page === 0;
  document.getElementById('btnPrev').disabled = page === 0;
  document.getElementById('btnNext').disabled = page >= totalPages() - 1;
  document.getElementById('btnLast').disabled = page >= totalPages() - 1;

  if (slice.length === 0) {
    container.innerHTML = '<div class="empty">No matching samples.</div>';
    return;
  }

  container.innerHTML = slice.map((item, i) => {
    const globalIdx = start + i;
    const images = item.images || [];

    // Original question with image placeholders
    const qHTML = renderImagePlaceholders(item.question || '', images);

    // Images gallery
    let imagesHTML = '';
    if (images.length > 0) {
      imagesHTML = '<div class="images-row">' + images.map((src, j) => `
        <div class="img-container">
          <img src="${src}" alt="Image ${j+1}" loading="lazy" onclick="openLightbox('${src}')">
          <div class="img-label">Image ${j+1}: ${escapeHTML(src.split('/').pop())}</div>
        </div>
      `).join('') + '</div>';
    }

    // Original answer
    const origAnswer = Array.isArray(item.answer) ? item.answer.join(', ') : (item.answer || '');
    const origAnswerHTML = origAnswer
      ? `<div class="orig-answer-row"><strong>Original Answer:</strong> ${escapeHTML(origAnswer)}</div>`
      : '';

    // Tier1 questions
    const agreeFilter = document.getElementById('filterAgreement').value;
    const t1List = item.tier1_questions || [];
    const t1Visible = agreeFilter
      ? t1List.map((q, qi) => [q, qi]).filter(([q]) => classifyAgreement(q) === agreeFilter)
      : t1List.map((q, qi) => [q, qi]);
    const tier1HTML = t1Visible.map(([q, qi]) => {
      const qid = q.question_id || '';
      const typeLetter = q.type || '';
      const typeName = q.type_name || '';
      const opts = q.options || {};
      const correctLetter = q.generator_answer || '';
      const revealKey = `${globalIdx}:${qi}`;
      const show = revealAll || revealedT1.has(revealKey);
      const agreement = classifyAgreement(q);
      const mv = (q.reference_answers && q.reference_answers.model_votes) || {};
      const majority = (q.reference_answers && q.reference_answers.majority_vote) || '';
      const votePillsHTML = Object.keys(mv).length
        ? '<div class="t1-votes"><div class="vote-row">' +
          '<strong>Votes:</strong>' +
          Object.entries(mv).map(([m, v]) => {
            const cls = v === correctLetter ? 'match' : 'mismatch';
            return `<span class="vote-pill ${cls}" title="${escapeHTML(m)}">${escapeHTML(shortModel(m))}: ${escapeHTML(v)}</span>`;
          }).join('') +
          (majority ? `<span style="color:#666;">· majority: <strong>${escapeHTML(majority)}</strong></span>` : '') +
          '</div></div>'
        : '';

      const optKeys = Object.keys(opts).sort();
      const optionsHTML = optKeys.length
        ? '<div class="t1-options">' + optKeys.map(k => {
            const isCorrect = k === correctLetter;
            const cls = show && isCorrect ? 'correct' : '';
            return `<div class="t1-option ${cls}">
              <span class="t1-option-letter">${escapeHTML(k)}.</span>
              <span>${renderImagePlaceholders(String(opts[k]), images)}${show && isCorrect ? ' ✓' : ''}</span>
            </div>`;
          }).join('') + '</div>'
        : '';

      const answerHTML = show
        ? `<div class="t1-answer"><strong>Answer:</strong> ${escapeHTML(correctLetter)} <span class="toggle" onclick="toggleT1(${globalIdx},${qi})">[hide]</span></div>`
        : `<div class="t1-answer"><span class="toggle" onclick="toggleT1(${globalIdx},${qi})">Show answer</span></div>`;

      return `<div class="tier1-card">
        <div class="t1-header">
          <span class="t1-type-badge t1-type-${typeLetter}">${escapeHTML(typeLetter)} · ${escapeHTML(typeName)}</span>
          <span class="t1-agreement-badge agree-${agreement}">${AGREEMENT_LABELS[agreement]}</span>
          <span class="t1-qid">${escapeHTML(qid)}</span>
        </div>
        <div class="t1-question">${renderImagePlaceholders(q.question || '', images)}</div>
        ${optionsHTML}
        ${answerHTML}
        ${votePillsHTML}
      </div>`;
    }).join('');

    return `<div class="card">
      <div class="card-header">
        <span class="id">${escapeHTML(item.id)}</span>
        <span class="badge dataset">${escapeHTML(item.dataset || '')}</span>
        <span class="badge domain">${escapeHTML(item.domain || '—')}</span>
        <span class="badge qtype">${escapeHTML(item.question_type || '')}</span>
        ${item.subdomain ? `<span class="badge subdomain">${escapeHTML(item.subdomain)}</span>` : ''}
      </div>
      <div class="card-body">
        <div class="section-label">Original Question</div>
        <div class="question-text">${qHTML}</div>
        ${imagesHTML}
        ${origAnswerHTML}
        <div class="tier1-section">
          <div class="tier1-title">Tier 1 Questions (${t1Visible.length}${agreeFilter && t1Visible.length !== t1List.length ? ` of ${t1List.length}` : ''})</div>
          <div class="tier1-grid">${tier1HTML}</div>
        </div>
      </div>
    </div>`;
  }).join('');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleT1(gi, qi) {
  const key = `${gi}:${qi}`;
  if (revealedT1.has(key)) revealedT1.delete(key);
  else revealedT1.add(key);
  render();
}

// --- Lightbox ---
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('active');
}
document.getElementById('lightbox').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('active');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('active');
});
</script>
</body>
</html>
