<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tier3 Annotator</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="window.__katexReady=true; if (typeof maybeRenderLatex==='function') maybeRenderLatex();"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }

  .top-bar {
    position: sticky; top: 0; z-index: 100;
    background: #fff; border-bottom: 1px solid #ddd;
    padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .top-bar label { font-weight: 600; font-size: 13px; color: #555; }
  .top-bar input[type=text] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; width: 420px; }
  .top-bar .progress { font-size: 13px; color: #444; }
  .top-bar .progress .done { color: #137333; font-weight: 700; }
  .top-bar .status { font-size: 12px; color: #888; margin-left: auto; min-width: 140px; text-align: right; }
  .top-bar .status.error { color: #d93025; }
  .top-bar .status.ok { color: #137333; }
  .top-bar button {
    padding: 6px 14px; border: 1px solid #ccc; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 13px;
  }
  .top-bar button:hover { background: #eee; }
  .top-bar button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  .top-bar button.primary:hover { background: #1557b0; }

  .nav-bar {
    position: sticky; top: 52px; z-index: 99;
    background: #fafafa; border-bottom: 1px solid #e0e0e0;
    padding: 8px 20px; display: flex; gap: 8px; align-items: center;
  }
  .nav-bar button {
    padding: 6px 14px; border: 1px solid #ccc; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 13px;
  }
  .nav-bar button:hover { background: #eee; }
  .nav-bar button:disabled { opacity: .4; cursor: default; }
  .nav-bar .page-info { font-size: 13px; color: #666; margin: 0 8px; }
  .nav-bar .jump { display: flex; gap: 4px; align-items: center; margin-left: auto; }
  .nav-bar .jump input { width: 80px; padding: 5px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }

  /* Three independent panels: 2-col top + full-width bottom */
  .layout {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 12px;
    padding: 12px 20px;
    height: calc(100vh - 108px);
    overflow: hidden;
  }
  .panel {
    overflow-y: auto; overflow-x: hidden;
    background: #fff; border-radius: 10px; border: 1px solid #e0e0e0;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }

  @media (max-width: 1200px) {
    .layout { grid-template-columns: 1fr; height: auto; overflow: visible; }
    .panel { overflow: visible; }
  }

  .panel-header {
    position: sticky; top: 0; z-index: 10;
    padding: 12px 18px; background: #f8f9fa; border-bottom: 1px solid #e8e8e8;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .panel-header .id { font-weight: 700; font-size: 14px; color: #1a73e8; }
  .panel-header .finished-chip { margin-left: auto; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: #eceff1; color: #546e7a; }
  .panel-header .finished-chip.done { background: #e6f4ea; color: #137333; }
  .panel-body { padding: 16px 18px; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }
  .badge.dataset { background: #e8f0fe; color: #1a73e8; }
  .badge.domain { background: #fce8e6; color: #d93025; }
  .badge.qtype { background: #e6f4ea; color: #137333; }
  .badge.subdomain { background: #fef7e0; color: #b06000; }
  .badge.tier { background: #e3f2fd; color: #0d47a1; }

  .section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    color: #888; letter-spacing: .5px; margin: 12px 0 6px;
  }
  .section-label:first-child { margin-top: 0; }

  .question-text {
    font-size: 14px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word; margin-bottom: 12px;
  }
  .img-placeholder {
    display: inline-block; vertical-align: middle;
    background: #e8f0fe; color: #1a73e8; padding: 1px 6px;
    border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .img-placeholder:hover { background: #c6dafa; }

  .images-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .img-container {
    border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden;
    background: #fafafa; text-align: center; max-width: 340px;
    transition: border-color .3s, box-shadow .3s;
  }
  .img-container img {
    display: block; max-width: 100%; max-height: 280px;
    object-fit: contain; margin: 0 auto; cursor: zoom-in;
  }
  .img-container .img-label {
    padding: 4px 8px; font-size: 11px; color: #666;
    background: #f0f0f0; border-top: 1px solid #e0e0e0;
  }

  .options-list { margin-bottom: 10px; }
  .option-item {
    display: flex; gap: 8px; padding: 4px 10px; margin-bottom: 3px;
    border-radius: 5px; font-size: 13px; line-height: 1.5;
  }
  .option-letter { font-weight: 700; min-width: 18px; color: #555; }

  .answer-box {
    font-size: 14px; line-height: 1.55; padding: 8px 12px;
    background: #f8f9fa; border-radius: 6px; white-space: pre-wrap; word-break: break-word;
    margin-bottom: 10px;
  }

  /* Hints */
  .hint-collapsible {
    background: #f3f6fb; border-left: 3px solid #4a6fb5; border-radius: 4px;
    padding: 6px 10px; margin-bottom: 8px; font-size: 12px;
  }
  .hint-collapsible summary { cursor: pointer; font-weight: 700; color: #4a6fb5; user-select: none; }
  .hint-collapsible[open] summary { margin-bottom: 6px; }
  .hint-body { white-space: pre-wrap; word-break: break-word; line-height: 1.5; }

  .diff-eq  { color: inherit; }
  .diff-del { background: #fce8e6; color: #c5221f; text-decoration: line-through; padding: 0 2px; border-radius: 2px; }
  .diff-ins { background: #e6f4ea; color: #137333; padding: 0 2px; border-radius: 2px; }
  .diff-body { white-space: pre-wrap; word-break: break-word; line-height: 1.6; margin-top: 4px; }

  .fact-list { margin: 4px 0 0 18px; font-size: 12px; }
  .fact-list li { margin-bottom: 2px; }

  /* Annotation controls */
  .annot-section {
    border-top: 2px solid #e0e0e0; padding-top: 14px; margin-top: 14px;
  }
  .annot-section .section-label { color: #1a73e8; }
  .annot-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .annot-row .annot-label { font-size: 13px; color: #444; font-weight: 600; min-width: 200px; }
  .annot-row label { font-size: 13px; color: #444; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .annot-row label input[type=radio] { margin: 0; }
  .annot-row label:has(input:checked) { color: #1a73e8; font-weight: 700; }

  .annot-textarea {
    width: 100%; min-height: 100px; padding: 8px 10px;
    border: 1px solid #c8d0da; border-radius: 6px; font-size: 13px;
    font-family: inherit; line-height: 1.5; resize: vertical;
  }

  .empty-hint { color: #999; font-style: italic; font-size: 13px; padding: 12px 0; }
  .loading { text-align: center; padding: 60px; font-size: 18px; color: #888; grid-column: 1 / -1; }

  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.85); align-items: center; justify-content: center; cursor: zoom-out;
  }
  .lightbox.active { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 92vh; object-fit: contain; border-radius: 8px; }
</style>
</head>
<body>

<div class="top-bar">
  <label>File:</label>
  <input type="text" id="fileInput" placeholder="data/filtered_data_with_solution_hard_tier3_jpg_pruned_fixed.json">
  <button id="btnLoad">Load</button>
  <span class="progress" id="progressLabel">—</span>
  <label style="margin-left:12px;"><input type="checkbox" id="autosaveToggle" checked> Autosave</label>
  <label><input type="checkbox" id="latexToggle"> Render LaTeX</label>
  <button id="btnSave" class="primary">Save</button>
  <span class="status" id="statusLabel"></span>
</div>

<div class="nav-bar">
  <button id="btnFirst">⟨⟨ First</button>
  <button id="btnPrev">⟨ Prev</button>
  <span class="page-info" id="pageInfo">—</span>
  <button id="btnNext">Next ⟩</button>
  <button id="btnLast">Last ⟩⟩</button>
  <button id="btnNextUnfinished" style="margin-left:12px;">Next unfinished ⟩</button>
  <div class="jump">
    <input type="text" id="jumpInput" placeholder="Go to #">
    <button id="btnJump">Go</button>
  </div>
</div>

<div class="layout" id="layout">
  <div class="loading" id="loadingMsg">Enter a data filename and press Load.</div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="">
</div>

<script>
// ========== state ==========
let fileName = '';
let problems = [];
let idx = 0;
let saving = false;
let saveTimer = null;

// ========== utils ==========
function escapeHTML(str) {
  return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/`/g, '&#96;').replace(/\$/g, '&#36;');
}

function renderImagePlaceholders(text, images) {
  const escaped = escapeHTML(text);
  return escaped.replace(/&lt;image_(\d+)&gt;/g, (match, num) => {
    const i = parseInt(num) - 1;
    if (images && images[i]) {
      return `<span class="img-placeholder" onclick="openLightbox('${imgPath(escapeHTML(images[i]))}')">[Image ${num}]</span>`;
    }
    return `<span class="img-placeholder">[Image ${num}]</span>`;
  });
}

function imgPath(src) { return 'data/' + src; }

function nowIso() { return new Date().toISOString(); }

// ========== word-level diff (LCS) ==========
function tokenizeForDiff(s) {
  return (s || '').match(/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff\u3040-\u30ff]|[A-Za-z0-9_]+|\s+|./gu) || [];
}
function wordDiff(a, b) {
  const A = tokenizeForDiff(a), B = tokenizeForDiff(b);
  const m = A.length, n = B.length;
  const dp = Array.from({ length: m + 1 }, () => new Int32Array(n + 1));
  for (let i = m - 1; i >= 0; i--) {
    for (let j = n - 1; j >= 0; j--) {
      dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1
                               : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const ops = [];
  let i = 0, j = 0;
  while (i < m && j < n) {
    if (A[i] === B[j])           { ops.push(['eq',  A[i++]]); j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) ops.push(['del', A[i++]]);
    else                                    ops.push(['ins', B[j++]]);
  }
  while (i < m) ops.push(['del', A[i++]]);
  while (j < n) ops.push(['ins', B[j++]]);
  return ops;
}
function renderWordDiff(orig, pruned) {
  if (!orig && !pruned) return '<em style="color:#999;">(empty)</em>';
  const ops = wordDiff(orig || '', pruned || '');
  if (!ops.some(o => o[0] !== 'eq')) {
    return '<em style="color:#888;">(no changes — pruned text is identical to original)</em>';
  }
  return ops.map(([t, w]) => {
    const html = escapeHTML(w);
    if (t === 'eq')  return `<span class="diff-eq">${html}</span>`;
    if (t === 'del') return `<span class="diff-del">${html}</span>`;
    return `<span class="diff-ins">${html}</span>`;
  }).join('');
}

// ========== lightbox ==========
function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = src;
  lb.classList.add('active');
}
document.getElementById('lightbox').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('active');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('active');
});

// ========== options rendering ==========
function renderOptions(opts, images) {
  if (!opts || !Array.isArray(opts) || opts.length === 0) return '';
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  return `<div class="options-list">${opts.map((o, i) =>
    `<div class="option-item"><span class="option-letter">${letters[i] || '?'}</span>
      <span>${renderImagePlaceholders(String(o), images)}</span></div>`
  ).join('')}</div>`;
}

// ========== finished detection ==========
function isProblemFinished(p) {
  const tp = (p.tier3_pruned_questions || [])[0];
  if (!tp) return false;
  const a = tp.annotation;
  if (!a) return false;
  if (typeof a.prunable !== 'boolean') return false;
  if (a.prunable && !(a.corrected_pruned_question && a.corrected_pruned_question.trim())) return false;
  if (!a.image_equivalence) return false;
  if (!a.difficulty) return false;
  return true;
}

// ========== load / save ==========
function setStatus(text, kind = '') {
  const el = document.getElementById('statusLabel');
  el.textContent = text;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

async function loadFile(name) {
  setStatus('loading…');
  try {
    const res = await fetch(name, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('file is not a JSON array');
    fileName = name;
    problems = data;
    idx = 0;
    document.getElementById('loadingMsg')?.remove();
    renderAll();
    setStatus(`loaded ${problems.length} problems`, 'ok');
    const firstUnfinished = problems.findIndex(p => !isProblemFinished(p));
    if (firstUnfinished > 0) { idx = firstUnfinished; renderAll(); }
  } catch (e) {
    setStatus('load failed: ' + e.message, 'error');
    document.getElementById('layout').innerHTML = `<div class="loading">Failed to load ${escapeHTML(name)}: ${escapeHTML(e.message)}</div>`;
  }
}

async function saveCurrent() {
  if (!problems.length || saving) return;
  saving = true;
  setStatus('saving…');
  const p = problems[idx];
  const tp = (p.tier3_pruned_questions || [])[0];
  const annotation = tp && tp.annotation ? tp.annotation : null;

  try {
    const res = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file: fileName, problem_id: p.id, annotation }),
    });
    const body = await res.json();
    if (!res.ok || !body.ok) throw new Error(body.error || `HTTP ${res.status}`);
    setStatus('saved ' + new Date().toLocaleTimeString(), 'ok');
    renderProgress();
  } catch (e) {
    setStatus('save failed: ' + e.message, 'error');
  } finally {
    saving = false;
  }
}

function scheduleAutosave() {
  if (!document.getElementById('autosaveToggle').checked) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCurrent, 600);
}

// ========== rendering ==========
function renderProgress() {
  const done = problems.filter(isProblemFinished).length;
  document.getElementById('progressLabel').innerHTML =
    `<span class="done">${done}</span> / ${problems.length} finished`;
  document.getElementById('pageInfo').textContent =
    problems.length ? `${idx + 1} / ${problems.length}` : '—';
}

function renderAll() {
  if (!problems.length) return;
  renderProgress();
  const p = problems[idx];
  document.getElementById('layout').innerHTML =
    renderPanelLeft(p) + renderPanelRight(p);
  bindAnnotationEvents(p);
  maybeRenderLatex();
}

function maybeRenderLatex() {
  const toggle = document.getElementById('latexToggle');
  if (!toggle || !toggle.checked) return;
  if (!window.__katexReady || !window.renderMathInElement) return;
  const layout = document.getElementById('layout');
  if (!layout) return;
  try {
    renderMathInElement(layout, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$',  right: '$',  display: false },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false },
      ],
      throwOnError: false,
      errorColor: '#d93025',
      ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'input'],
    });
  } catch (e) { /* best-effort */ }
}

// ----- Panel 1: Top-Left — Original Problem -----
function renderPanelLeft(p) {
  const badges = [];
  if (p.dataset) badges.push(`<span class="badge dataset">${escapeHTML(p.dataset)}</span>`);
  if (p.domain) badges.push(`<span class="badge domain">${escapeHTML(p.domain)}</span>`);
  if (p.subdomain) badges.push(`<span class="badge subdomain">${escapeHTML(p.subdomain)}</span>`);
  if (p.question_type) badges.push(`<span class="badge qtype">${escapeHTML(p.question_type)}</span>`);

  const images = p.images || [];
  const imgHtml = images.length
    ? `<div class="images-row">${images.map((src, i) => `
         <div class="img-container">
           <img src="${imgPath(escapeHTML(src))}" onclick="openLightbox('${imgPath(escapeHTML(src))}')" alt="image ${i+1}">
           <div class="img-label">Image ${i+1}</div>
         </div>`).join('')}</div>`
    : '<div class="empty-hint">(no images)</div>';

  const answer = Array.isArray(p.answer) ? p.answer.join(', ') : (p.answer ?? '');

  return `
  <div class="panel panel-left">
    <div class="panel-header">
      <span class="id">${escapeHTML(p.id || '')}</span>
      ${badges.join(' ')}
      <span style="font-size:11px;color:#888;">ORIGINAL</span>
    </div>
    <div class="panel-body">
      <div class="section-label">Images</div>
      ${imgHtml}
      <div class="section-label">Question</div>
      <div class="question-text">${renderImagePlaceholders(p.question || '', images)}</div>
      ${renderOptions(p.options, images)}
      <div class="section-label">Answer</div>
      <div class="answer-box">${escapeHTML(answer || '(none)')}</div>
    </div>
  </div>`;
}

// ----- Panel 2: Right — Tier3 + Pruned + Hints + Annotation -----
function renderPanelRight(p) {
  const t3 = (p.tier3_questions || [])[0];
  const tp = (p.tier3_pruned_questions || [])[0];
  if (!t3) return `<div class="panel"><div class="panel-body"><div class="empty-hint">No tier3 question.</div></div></div>`;

  const t3Images = t3.images || [];
  const imgHtml = t3Images.length
    ? `<div class="images-row">${t3Images.map((src, i) => `
         <div class="img-container">
           <img src="${imgPath(escapeHTML(src))}" onclick="openLightbox('${imgPath(escapeHTML(src))}')" alt="tier3 image ${i+1}">
           <div class="img-label">Tier3 Image ${i+1}</div>
         </div>`).join('')}</div>`
    : '<div class="empty-hint">(no tier3 images)</div>';

  const answer = Array.isArray(t3.answer) ? t3.answer.join(', ') : (t3.answer ?? '');

  // Pruned question (plain text, not diff)
  const prunedHtml = tp && tp.pruned_question
    ? `<div class="section-label">Tier3 Pruned Question</div>
       <div class="question-text">${renderImagePlaceholders(tp.pruned_question, t3Images)}</div>`
    : '';

  const finishedChip = isProblemFinished(p)
    ? '<span class="finished-chip done">✓ finished</span>'
    : '<span class="finished-chip">in progress</span>';

  // ----- Hints (all collapsible, collapsed by default) -----
  const hints = [];
  if (tp) {
    if (tp.masked_question) {
      hints.push(`
        <details class="hint-collapsible">
          <summary>Masked question</summary>
          <div class="hint-body">${escapeHTML(tp.masked_question)}</div>
        </details>`);
    }
    if (tp.recovered_question) {
      hints.push(`
        <details class="hint-collapsible">
          <summary>Recovered question</summary>
          <div class="hint-body">${escapeHTML(tp.recovered_question)}</div>
        </details>`);
    }
    if (tp.pruned_question != null && t3.question != null) {
      hints.push(`
        <details class="hint-collapsible">
          <summary>Word diff (tier3 question → pruned)</summary>
          <div class="diff-body">${renderWordDiff(t3.question, tp.pruned_question)}</div>
        </details>`);
    }
    if (tp.binary_label !== 2 && tp.explanation) {
      hints.push(`
        <details class="hint-collapsible">
          <summary>Stage-3 explanation (binary_label=${tp.binary_label})</summary>
          <div class="hint-body">${escapeHTML(tp.explanation)}</div>
        </details>`);
    }
    const missingFacts = (tp.stage4_labels || []).filter(x => x && (x.label === 'None' || x.label === 'none'));
    if (missingFacts.length) {
      hints.push(`
        <details class="hint-collapsible">
          <summary>Facts flagged as missing</summary>
          <ul class="fact-list">${missingFacts.map(f => `<li>${escapeHTML(f.fact)}</li>`).join('')}</ul>
        </details>`);
    }
  }

  // ----- Annotation controls -----
  let annotHtml = '';
  if (tp) {
    const ann = tp.annotation || {};
    const prunable = ann.prunable;
    const corrected = ann.corrected_pruned_question ?? tp.pruned_question ?? '';
    const imgEq = ann.image_equivalence || '';
    const diff = ann.difficulty || '';
    const imgHasText = ann.image_has_text || false;
    const rejected = ann.rejected || false;
    const yesChecked = prunable === true ? 'checked' : '';
    const noChecked = prunable === false ? 'checked' : '';
    const showTextarea = prunable === true;

    annotHtml = `
      <div class="annot-section">
        <div class="section-label">Annotation</div>
        <div class="annot-row">
          <span class="annot-label">1. Is this problem prunable?</span>
          <label><input type="radio" name="ann_prunable" value="yes" ${yesChecked}> <span>Yes</span></label>
          <label><input type="radio" name="ann_prunable" value="no" ${noChecked}> <span>No</span></label>
        </div>
        <div style="${showTextarea ? '' : 'display:none;'}" data-row="corrected_text">
          <div style="font-size:12px;color:#666;margin-bottom:4px;">Corrected pruned question:</div>
          <textarea class="annot-textarea" id="correctedTextarea">${escapeHTML(corrected)}</textarea>
        </div>
        <div class="annot-row" style="margin-top:8px;">
          <span class="annot-label">2. Are tier3 images equivalent?</span>
          <label><input type="radio" name="ann_imgeq" value="equivalent" ${imgEq === 'equivalent' ? 'checked' : ''}> <span>Equivalent reproduction</span></label>
          <label><input type="radio" name="ann_imgeq" value="edited" ${imgEq === 'edited' ? 'checked' : ''}> <span>Edited/added/removed elements</span></label>
        </div>
        <div class="annot-row" style="margin-top:8px;">
          <span class="annot-label">3. Difficulty vs original?</span>
          <label><input type="radio" name="ann_diff" value="easier" ${diff === 'easier' ? 'checked' : ''}> <span>Easier</span></label>
          <label><input type="radio" name="ann_diff" value="same" ${diff === 'same' ? 'checked' : ''}> <span>Same</span></label>
          <label><input type="radio" name="ann_diff" value="harder" ${diff === 'harder' ? 'checked' : ''}> <span>Harder</span></label>
        </div>
        <div class="annot-row" style="margin-top:8px;">
          <label style="color:#b06000;"><input type="checkbox" id="ann_imgtext" ${imgHasText ? 'checked' : ''}>
            <span>The edited image includes problem text and/or options, which should be removed.</span></label>
        </div>
        <div class="annot-row" style="margin-top:4px;">
          <label style="color:#d93025;"><input type="checkbox" id="ann_rejected" ${rejected ? 'checked' : ''}>
            <span>The edited problem should be rejected because it is not solvable.</span></label>
        </div>
      </div>`;
  }

  return `
  <div class="panel">
    <div class="panel-header">
      <span class="id">${escapeHTML(t3.question_id || '')}</span>
      <span class="badge tier">TIER 3</span>
      ${tp ? `<span class="badge tier" style="background:#fef7e0;color:#b06000;">+ PRUNED</span>` : ''}
      ${finishedChip}
    </div>
    <div class="panel-body">
      <div class="section-label">Tier3 Images</div>
      ${imgHtml}
      <div class="section-label">Tier3 Question</div>
      <div class="question-text">${renderImagePlaceholders(t3.question || '', t3Images)}</div>
      ${prunedHtml}
      ${renderOptions(t3.options, t3Images)}
      <div class="section-label">Tier3 Answer</div>
      <div class="answer-box">${escapeHTML(answer || '(none)')}</div>
      ${hints.length ? '<div class="section-label" style="margin-top:16px;">Hints</div>' + hints.join('') : ''}
      ${annotHtml}
    </div>
  </div>`;
}

// (Bottom panel removed — content merged into right panel)

// ========== event wiring ==========
function bindAnnotationEvents(p) {
  const tp = (p.tier3_pruned_questions || [])[0];
  if (!tp) return;

  // 1. Prunable radio
  document.querySelectorAll('input[name="ann_prunable"]').forEach(el => {
    el.addEventListener('change', () => {
      tp.annotation = tp.annotation || {};
      tp.annotation.prunable = (el.value === 'yes');
      tp.annotation.annotated_at = nowIso();
      const textRow = document.querySelector('[data-row="corrected_text"]');
      if (tp.annotation.prunable) {
        if (textRow) textRow.style.display = '';
        const ta = document.getElementById('correctedTextarea');
        if (ta && !tp.annotation.corrected_pruned_question) {
          tp.annotation.corrected_pruned_question = ta.value || tp.pruned_question || '';
        }
      } else {
        tp.annotation.corrected_pruned_question = null;
        if (textRow) textRow.style.display = 'none';
      }
      updateFinishedChip(p);
      renderProgress();
      scheduleAutosave();
    });
  });

  // Textarea for corrected pruned question
  const ta = document.getElementById('correctedTextarea');
  if (ta) {
    ta.addEventListener('input', () => {
      tp.annotation = tp.annotation || {};
      tp.annotation.corrected_pruned_question = ta.value;
      tp.annotation.annotated_at = nowIso();
      updateFinishedChip(p);
      renderProgress();
      scheduleAutosave();
    });
  }

  // 2. Image equivalence radio
  document.querySelectorAll('input[name="ann_imgeq"]').forEach(el => {
    el.addEventListener('change', () => {
      tp.annotation = tp.annotation || {};
      tp.annotation.image_equivalence = el.value;
      tp.annotation.annotated_at = nowIso();
      updateFinishedChip(p);
      renderProgress();
      scheduleAutosave();
    });
  });

  // 3. Difficulty radio
  document.querySelectorAll('input[name="ann_diff"]').forEach(el => {
    el.addEventListener('change', () => {
      tp.annotation = tp.annotation || {};
      tp.annotation.difficulty = el.value;
      tp.annotation.annotated_at = nowIso();
      updateFinishedChip(p);
      renderProgress();
      scheduleAutosave();
    });
  });

  // 4. Image has text checkbox
  const imgTextEl = document.getElementById('ann_imgtext');
  if (imgTextEl) {
    imgTextEl.addEventListener('change', () => {
      tp.annotation = tp.annotation || {};
      tp.annotation.image_has_text = imgTextEl.checked;
      tp.annotation.annotated_at = nowIso();
      scheduleAutosave();
    });
  }

  // 5. Rejected checkbox
  const rejectedEl = document.getElementById('ann_rejected');
  if (rejectedEl) {
    rejectedEl.addEventListener('change', () => {
      tp.annotation = tp.annotation || {};
      tp.annotation.rejected = rejectedEl.checked;
      tp.annotation.annotated_at = nowIso();
      scheduleAutosave();
    });
  }
}

function updateFinishedChip(p) {
  const chips = document.querySelectorAll('.finished-chip');
  const done = isProblemFinished(p);
  chips.forEach(c => {
    c.className = 'finished-chip' + (done ? ' done' : '');
    c.textContent = done ? '✓ finished' : 'in progress';
  });
}

// ========== navigation ==========
function go(newIdx) {
  if (newIdx < 0 || newIdx >= problems.length) return;
  idx = newIdx;
  renderAll();
}

document.getElementById('btnFirst').addEventListener('click', () => go(0));
document.getElementById('btnPrev').addEventListener('click', () => go(idx - 1));
document.getElementById('btnNext').addEventListener('click', () => go(idx + 1));
document.getElementById('btnLast').addEventListener('click', () => go(problems.length - 1));
document.getElementById('btnNextUnfinished').addEventListener('click', () => {
  for (let i = 1; i <= problems.length; i++) {
    const j = (idx + i) % problems.length;
    if (!isProblemFinished(problems[j])) { go(j); return; }
  }
});
document.getElementById('btnJump').addEventListener('click', () => {
  const v = parseInt(document.getElementById('jumpInput').value);
  if (v >= 1 && v <= problems.length) go(v - 1);
});
document.getElementById('jumpInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btnJump').click();
});

document.getElementById('btnLoad').addEventListener('click', () => {
  const name = document.getElementById('fileInput').value.trim();
  if (name) loadFile(name);
});
document.getElementById('btnSave').addEventListener('click', saveCurrent);

document.getElementById('latexToggle').addEventListener('change', maybeRenderLatex);

// keyboard nav
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft' || e.key === 'p') go(idx - 1);
  if (e.key === 'ArrowRight' || e.key === 'n') go(idx + 1);
  if (e.key === 's' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); saveCurrent(); }
});

// auto-load from URL param
const params = new URLSearchParams(location.search);
const fileParam = params.get('file');
if (fileParam) {
  document.getElementById('fileInput').value = fileParam;
  loadFile(fileParam);
}
</script>
